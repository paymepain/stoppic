[package]
name = "stoppic"
version = "0.4.0"
description = "Бесплатный скриншотер и рекордер экрана"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-opener = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
xcap = "0.9.8"

[profile.dev.package."*"]
# Кодирование JPEG/PNG без оптимизаций в разы медленнее, даже при разработке
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
tauri-winrt-notification = "0.8.1"
wasapi = "0.25.0"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
windows-capture = "2.0.1"

[target."cfg(not(windows))".dependencies]
tauri-plugin-notification = "2.5.1"
