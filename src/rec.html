<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Recording</title>
  </head>
  <body>
    <div id="pill" data-state="countdown">
      <span id="dot"></span>
      <span id="count"></span>
      <span id="time">00:00</span>
      <span id="label"></span>
      <div class="spacer"></div>
      <button id="pause" type="button"></button>
      <button id="stop" type="button"></button>
      <button id="cancel" type="button"></button>
    </div>
    <script type="module" src="./rec.ts"></script>
  </body>
</html>
